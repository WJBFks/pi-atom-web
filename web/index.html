<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>pi-atom-web</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/style.css"><script defer src="/marked.js"></script><script defer src="/purify.js"></script><script defer src="/highlight.js"></script><link rel="stylesheet" href="/xterm.css"><script defer src="/xterm.js"></script><script defer src="/ask-user.js"></script><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/">π <span>atom<span class="muted"> / web</span></span></a><span class="badge">TUI 会话扩展</span><div class="spacer"></div><span id="connection" role="status">连接中</span><button id="theme" aria-label="切换明暗主题"><span data-icon="theme"></span></button></header>
<div class="layout"><aside><div class="eyebrow">CURRENT SESSION</div><h2 id="session-name">未命名会话</h2><span class="session-label">与终端实时同步</span><nav><button class="active" data-view="chat"><span data-icon="chat"></span><span>对话</span></button><button data-view="trace"><span data-icon="trace"></span><span>执行轨迹</span></button></nav><div class="info"><label>工作目录</label><p id="cwd">—</p><label>模型</label><p id="model">—</p><label>思考等级</label><p id="thinking">—</p></div><div class="aside-bottom"><div id="session-info-popover" hidden></div><button type="button" id="session-info-button"><span data-icon="session"></span><span>会话信息</span></button></div></aside>
<main><div class="toolbar"><div><strong id="view-title">对话</strong><span id="activity">等待连接</span></div><button id="bottom"><span data-icon="down"></span>最新消息</button></div><div id="scroll"><div id="messages"></div></div><section class="compose-wrap"><section id="plugin-requests" aria-label="扩展请求"></section><div id="error" role="alert" hidden></div><form id="composer"><div id="command-menu" hidden><div class="command-heading">斜杠命令 <span>↑ ↓ 选择 · Tab / Enter 补全 · Esc 关闭</span></div><div id="command-list" role="listbox" aria-label="可用斜杠命令"></div></div><textarea id="prompt" placeholder="消息输入 / 使用命令，输入 @ 查找文件" rows="2" aria-label="消息" aria-autocomplete="list" aria-controls="command-list" aria-expanded="false"></textarea><select id="mode" hidden aria-label="生成中的消息发送方式"><option value="followUp">default</option><option value="steer">steer</option></select><div id="model-picker" class="setting-picker" hidden></div><div id="thinking-picker" class="setting-picker thinking-picker" hidden></div><div class="compose-actions"><div></div><div class="compose-right"><span class="composer-ready" aria-hidden="true"></span><button type="button" id="model-button" class="composer-setting"><span id="composer-model">未选择模型</span></button><button type="button" id="thinking-button" class="composer-setting"><span id="composer-thinking">off</span></button><button type="button" id="stop" hidden aria-label="停止生成"><span data-icon="stop"></span></button><button class="primary" id="send" disabled aria-label="发送消息"><span data-icon="send"></span></button></div></div></form><div class="status-shell"><div id="status-popover" hidden></div><div id="session-status" class="status-bar"></div></div></section></main></div></body></html>
